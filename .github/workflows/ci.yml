name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the rehearsal be re-run by hand after a secret or a production
  # database changes, without pushing a commit to ask for it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the Node line .node-version names and the npm that
# package.json's packageManager pins, as a developer's machine does.
jobs:
  # The type check and each part of the suite run side by side, each on its
  # own runner: one after another on one runner they took three minutes.
  # The parts are the suite's projects (vitest.config.ts), the D1 suite, and
  # the suite that runs the Worker and its Durable Objects in workerd.
  typecheck:
    name: Check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: tsrs
            command: npm run typecheck
          # Oxlint reads the types through tsrs (.oxlintrc.json). Its rules only
          # warn for now, but one: `any`, which no file outside the chat uses.
          - checker: Oxlint
            command: npm run lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: ${{ matrix.command }}

  test:
    name: Test (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A worker runs its files in one module graph (vitest.config.ts), so CI
        # runs files and tests in a new random order each time: a test that
        # passes only after another one, or fails after it, fails here.
        # Vitest prints the seed; `--sequence.seed=<seed>` replays that order.
        include:
          - part: GUI
            command: npx vitest run --project web --sequence.shuffle
          - part: chat
            command: npx vitest run --project chat --sequence.shuffle
          - part: Worker
            command: npx vitest run --project node --sequence.shuffle
          - part: D1
            command: npm run test:d1
          - part: Durable Objects
            command: npm run test:do -- --sequence.shuffle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: ${{ matrix.command }}

  verify:
    # The check a pull request is required to pass, by the name it has always
    # had: it passes only when the type check and every part of the suite did.
    name: Typecheck and test
    if: always()
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.typecheck.result }}" = success && test "${{ needs.test.result }}" = success

  rehearse-migrations:
    # Every pending migration is replayed against an export of every
    # production database before it can merge. A failure here is the failure
    # production would have shown after the deploy.
    name: Rehearse migrations against production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run db:rehearse:remote
